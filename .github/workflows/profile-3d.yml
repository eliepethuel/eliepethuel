name: Generate 3D contribution graph

on:
  schedule:
    - cron: "0 18 * * *"     # tous les jours à 18h UTC
  workflow_dispatch:          # lancement manuel possible

permissions:
  contents: write

concurrency:
  group: readme-commit
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Générer le graphe 3D
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git commit -m "chore: mise à jour du graphe 3D"; then
            git pull --rebase
            git push
          fi
